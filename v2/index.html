<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#5fa4e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Grok Demo · Jetcraft: Invasion Earth</title>
<link rel="preload" href="assets/terrain.jpg" as="image" crossorigin>
<link rel="preload" href="fonts/nunito.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/lilita.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css?v=r2-0235f06">
</head>
<body>
<div id="wrap">
  <canvas id="gl"></canvas>
  <canvas id="ui"></canvas>
  <div id="hud" class="hidden">
    <div class="hudrow">
      <div id="hp"><div id="hpfill"></div></div>
      <div id="prog"><div id="progfill"></div><div id="progboss"></div></div>
      <button id="mute" aria-label="Toggle sound">🔊</button>
    </div>
    <div id="score">0</div>
    <div id="weap"></div>
  </div>
  <div id="banner"></div>
  <div id="start" class="screen">
    <div class="logo">
      <div class="logo-top">GROK DEMO</div>
      <div class="logo-sub">JETCRAFT: INVASION EARTH</div>
    </div>
    <div class="spacer"></div>
    <div class="tap">TAP TO FLY</div>
    <div class="hint">Drag left / right to steer · Auto fire<br>Shoot <b class="b">gates</b> to raise them · Break <b>pods</b> for weapons</div>
    <div id="loading">Loading…</div>
  </div>
  <div id="end" class="screen hidden">
    <div class="card">
      <div id="endtitle">MISSION COMPLETE</div>
      <div id="endsub">The Chitin Queen is down!</div>
      <div id="stars"><span>★</span><span>★</span><span>★</span></div>
      <div class="stats">
        <div><b id="st-kills">0</b><small>Spiders</small></div>
        <div><b id="st-drones">0</b><small>Wingmen</small></div>
        <div><b id="st-time">0s</b><small>Time</small></div>
      </div>
      <button id="again">FLY AGAIN</button>
    </div>
  </div>
</div>
<script type="module" src="game.js?v=r2-0235f06"></script>
</body>
</html>
